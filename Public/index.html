<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@300;400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070d;
      --glass: rgba(255,255,255,0.030);
      --glass-border: rgba(255,255,255,0.075);
      --glass-border-strong: rgba(255,255,255,0.13);
      --surface: rgba(255,255,255,0.04);
      --surface-2: rgba(255,255,255,0.065);
      --accent: #a78bfa;
      --accent-glow: rgba(167,139,250,0.18);
      --text-primary: #f1f0f5;
      --text-secondary: #9490a8;
      --text-muted: #4a4758;
      --user-bg: rgba(167,139,250,0.10);
      --user-border: rgba(167,139,250,0.22);
      --bot-bg: rgba(255,255,255,0.040);
      --bot-border: rgba(255,255,255,0.07);
      --danger: #f87171;
      --r: 20px;
      --r-sm: 12px;
    }
    html,body{height:100%;}
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Aurora */
    .aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;}
    .orb-1{width:520px;height:520px;background:radial-gradient(circle,#6d28d9 0%,transparent 70%);top:-140px;left:-100px;animation:drift1 18s ease-in-out infinite alternate;}
    .orb-2{width:420px;height:420px;background:radial-gradient(circle,#0e7490 0%,transparent 70%);bottom:-120px;right:-80px;animation:drift2 22s ease-in-out infinite alternate;}
    .orb-3{width:280px;height:280px;background:radial-gradient(circle,#7c3aed 0%,transparent 70%);top:55%;left:60%;opacity:.3;animation:drift3 14s ease-in-out infinite alternate;}
    @keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(60px,40px) scale(1.08);}}
    @keyframes drift2{from{transform:translate(0,0) scale(1);}to{transform:translate(-50px,-30px) scale(1.06);}}
    @keyframes drift3{from{transform:translate(0,0);}to{transform:translate(-40px,30px);}}
    /* Grain */
    body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.028;pointer-events:none;z-index:1;}
    /* Shell */
    .shell{position:relative;z-index:2;width:100%;max-width:700px;height:100vh;max-height:860px;display:flex;flex-direction:column;margin:0 16px;}
    /* Header */
    header{display:flex;align-items:center;padding:18px 28px;gap:16px;background:var(--glass);border:1px solid var(--glass-border);border-bottom:none;border-radius:var(--r) var(--r) 0 0;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
    .gem-icon{width:36px;height:36px;flex-shrink:0;}
    .gem-icon svg{width:36px;height:36px;}
    .header-copy{flex:1;}
    .header-copy h1{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;letter-spacing:.01em;color:var(--text-primary);line-height:1;}
    .header-copy span{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:300;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px;display:block;}
    .status{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-secondary);letter-spacing:.08em;}
    .status-pip{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.15);animation:pip 2.8s ease-in-out infinite;}
    @keyframes pip{0%,100%{opacity:1;}50%{opacity:.35;}}
    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--glass-border-strong) 30%,var(--glass-border-strong) 70%,transparent);}
    /* Chatbox */
    #chatbox{flex:1;overflow-y:auto;padding:28px 28px 20px;background:var(--glass);border-left:1px solid var(--glass-border);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;gap:20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);scroll-behavior:smooth;}
    #chatbox::-webkit-scrollbar{width:3px;}
    #chatbox::-webkit-scrollbar-track{background:transparent;}
    #chatbox::-webkit-scrollbar-thumb{background:var(--glass-border-strong);border-radius:10px;}
    /* Empty */
    #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;animation:fadeIn .6s ease both;}
    .empty-gem{width:56px;height:56px;opacity:.18;}
    #empty h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;font-style:italic;color:var(--text-primary);opacity:.5;}
    #empty p{font-size:13px;color:var(--text-muted);font-weight:300;max-width:240px;line-height:1.7;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;}
    .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-secondary);border:1px solid var(--glass-border-strong);border-radius:999px;padding:6px 14px;background:var(--surface);cursor:pointer;transition:all .2s;letter-spacing:.02em;}
    .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
    /* Messages */
    .msg-row{display:flex;gap:12px;align-items:flex-start;animation:msgIn .3s cubic-bezier(.34,1.56,.64,1) both;}
    .msg-row.user{flex-direction:row-reverse;}
    @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:13px;font-weight:700;font-style:italic;flex-shrink:0;margin-top:2px;}
    .avatar.bot{background:var(--accent-glow);border:1px solid rgba(167,139,250,.3);color:var(--accent);}
    .avatar.user{background:rgba(255,255,255,.06);border:1px solid var(--glass-border-strong);color:var(--text-secondary);}
    .msg-group{display:flex;flex-direction:column;gap:4px;max-width:78%;}
    .msg-row.user .msg-group{align-items:flex-end;}
    .bubble{padding:12px 17px;font-size:14px;font-weight:400;line-height:1.7;word-break:break-word;position:relative;}
    .bubble.bot{background:var(--bot-bg);border:1px solid var(--bot-border);border-radius:4px var(--r) var(--r) var(--r);color:var(--text-primary);}
    .bubble.user{background:var(--user-bg);border:1px solid var(--user-border);border-radius:var(--r) 4px var(--r) var(--r);color:var(--text-primary);}
    .bubble.error{border-color:rgba(248,113,113,.25);color:var(--danger);}
    .bubble strong{font-weight:500;color:var(--accent);}
    .bubble em{font-style:italic;opacity:.85;}
    .bubble code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:rgba(255,255,255,.07);border:1px solid var(--glass-border-strong);border-radius:5px;padding:1px 6px;}
    .bubble pre{background:rgba(0,0,0,.3);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;margin:8px 0;}
    .bubble pre code{background:none;border:none;padding:0;font-size:12px;}
    .bubble ul,.bubble ol{padding-left:20px;margin:6px 0;}
    .bubble li{margin:3px 0;}
    .timestamp{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.06em;padding:0 4px;}
    /* Copy */
    .copy-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:7px;border:1px solid var(--glass-border-strong);background:var(--surface-2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,color .15s;}
    .copy-btn svg{width:12px;height:12px;fill:currentColor;}
    .bubble:hover .copy-btn{opacity:1;}
    .copy-btn:hover{color:var(--accent);}
    .copy-btn.copied{color:#4ade80;}
    /* Typing */
    .typing-dots{display:flex;align-items:center;gap:5px;padding:4px 0;}
    .dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted);animation:dotBounce 1.3s ease-in-out infinite;}
    .dot:nth-child(2){animation-delay:.15s;}
    .dot:nth-child(3){animation-delay:.3s;}
    @keyframes dotBounce{0%,80%,100%{transform:translateY(0);background:var(--text-muted);}40%{transform:translateY(-6px);background:var(--accent);}}
    /* Input */
    .input-area{background:var(--glass);border:1px solid var(--glass-border);border-top:none;border-radius:0 0 var(--r) var(--r);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:14px 18px 16px;}
    .input-shell{display:flex;gap:12px;align-items:flex-end;background:rgba(255,255,255,.04);border:1px solid var(--glass-border-strong);border-radius:16px;padding:10px 12px 10px 18px;transition:border-color .25s,box-shadow .25s;}
    .input-shell:focus-within{border-color:rgba(167,139,250,.4);box-shadow:0 0 0 3px rgba(167,139,250,.07);}
    #userInput{flex:1;background:transparent;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:14px;font-weight:300;color:var(--text-primary);caret-color:var(--accent);resize:none;max-height:140px;line-height:1.6;overflow-y:auto;scrollbar-width:none;}
    #userInput::-webkit-scrollbar{display:none;}
    #userInput::placeholder{color:var(--text-muted);font-weight:300;}
    #sendBtn{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,opacity .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(124,58,237,.35);}
    #sendBtn:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(124,58,237,.5);}
    #sendBtn:active{transform:scale(.94);}
    #sendBtn:disabled{opacity:.35;transform:none;box-shadow:none;cursor:not-allowed;}
    #sendBtn svg{width:16px;height:16px;fill:#fff;margin-left:1px;}
    .input-meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding:0 4px;}
    .input-meta span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.06em;}
  </style>
</head>
<body>

<div class="aurora">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="shell">
  <header>
    <div class="gem-icon">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="18,3 33,13 33,23 18,33 3,23 3,13" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.45)" stroke-width="1"/>
        <polygon points="18,9 27,14.5 27,21.5 18,27 9,21.5 9,14.5" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="0.8"/>
        <circle cx="18" cy="18" r="3.5" fill="#a78bfa" opacity="0.9"/>
        <line x1="18" y1="3" x2="18" y2="9" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
        <line x1="18" y1="27" x2="18" y2="33" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
        <line x1="3" y1="13" x2="9" y2="14.5" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
        <line x1="27" y1="21.5" x2="33" y2="23" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
        <line x1="33" y1="13" x2="27" y2="14.5" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
        <line x1="9" y1="21.5" x2="3" y2="23" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>
      </svg>
    </div>
    <div class="header-copy">
      <h1>Gemini</h1>
      <span>Powered by Google DeepMind</span>
    </div>
    <div class="status">
      <div class="status-pip"></div>
      online
    </div>
  </header>

  <div class="divider"></div>

  <div id="chatbox">
    <div id="empty">
      <svg class="empty-gem" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="28,4 52,18 52,38 28,52 4,38 4,18" fill="none" stroke="white" stroke-width="1.5"/>
        <polygon points="28,14 42,22 42,34 28,42 14,34 14,22" fill="none" stroke="white" stroke-width="1"/>
        <circle cx="28" cy="28" r="5" fill="white"/>
      </svg>
      <h2>How can I help?</h2>
      <p>Ask me anything — I think, reason, and create.</p>
      <div class="chips">
        <div class="chip" onclick="useChip(this)">Explain quantum computing</div>
        <div class="chip" onclick="useChip(this)">Write me a poem</div>
        <div class="chip" onclick="useChip(this)">Summarise the news</div>
        <div class="chip" onclick="useChip(this)">Debug my code</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-shell">
      <textarea id="userInput" rows="1" placeholder="Ask Gemini anything…"></textarea>
      <button id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-meta">
      <span>↵ send &nbsp;·&nbsp; shift+↵ newline</span>
      <span id="charCount">0 / 4000</span>
    </div>
  </div>
</div>

<script>
  const chatbox = document.getElementById('chatbox');
  const input   = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const charCount = document.getElementById('charCount');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    charCount.textContent = input.value.length + ' / 4000';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  function useChip(el) {
    input.value = el.textContent;
    input.dispatchEvent(new Event('input'));
    input.focus();
  }

  function nowStr() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderMd(t) {
    return t
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>')
      .replace(/\n/g,'<br>');
  }

  function addMessage(text, role, isError) {
    const emp = document.getElementById('empty');
    if (emp) emp.remove();

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const av = document.createElement('div');
    av.className = `avatar ${role}`;
    av.textContent = role === 'bot' ? 'G' : 'Y';

    const group = document.createElement('div');
    group.className = 'msg-group';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}${isError ? ' error' : ''}`;
    const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    bubble.innerHTML = role === 'bot' ? renderMd(text) : safe.replace(/\n/g,'<br>');

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.title = 'Copy';
    copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
        }, 2000);
      });
    };
    bubble.appendChild(copyBtn);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = nowStr();

    group.appendChild(bubble);
    group.appendChild(ts);
    row.appendChild(av);
    row.appendChild(group);
    chatbox.appendChild(row);
    chatbox.scrollTop = chatbox.scrollHeight;
  }

  let typingEl = null;
  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'msg-row bot';
    typingEl.innerHTML = `<div class="avatar bot">G</div><div class="msg-group"><div class="bubble bot" style="padding:14px 17px;"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>`;
    chatbox.appendChild(typingEl);
    chatbox.scrollTop = chatbox.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg || sendBtn.disabled) return;
    addMessage(msg, 'user');
    input.value = '';
    input.style.height = 'auto';
    charCount.textContent = '0 / 4000';
    sendBtn.disabled = true;
    showTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply, 'bot');
    } catch {
      hideTyping();
      addMessage('Could not reach the server. Check your connection.', 'bot', true);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
